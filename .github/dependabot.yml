# Dependabot — consumido pelo GitHub, sem CI próprio. Abre PRs de atualização
# das Actions fixadas por SHA nos workflows; separado das security updates
# (Dependabot alerts).
# Agenda: domingo, 09:00 (America/Sao_Paulo). Um único PR agrupado com os bumps
# minor e patch; um major continua em PR próprio. As security updates seguem o
# ritmo dos alertas e ignoram esta agenda.
version: 2
updates:
  # Actions usadas nos workflows em .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
