name: Atualizar últimos posts do blog no README

# ---------------------------------------------------------------------------
# COMO FUNCIONA:
#
# Todo dia o workflow lê o feed RSS do blog (https://ryanmorais.com.br/blog/feed/,
# gerado pelo projeto site-ryan-morais com o django.contrib.syndication) e
# reescreve a lista de artigos do README entre os marcadores:
#      <!-- BLOG:START -->
#      <!-- BLOG:END -->
#
# Para atualizar na hora, sem esperar o agendamento: aba Actions > Run workflow.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # todo dia às 05:30 UTC

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Puxar posts do feed do blog
        # Fixada por SHA, nunca @master: é Action de terceiro e roda com
        # contents: write. O Dependabot lê o comentário de versão e propõe o
        # SHA novo (dependabot.yml).
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://ryanmorais.com.br/blog/feed/"
          comment_tag_name: "BLOG"
          # 4 itens, o mesmo teto dos vídeos do YouTube e da tabela de repositórios
          # em destaque: as três listas do perfil têm o mesmo tamanho.
          max_post_count: 4
          # $newline em minusculas: a action so reconhece esse nome
          template: "$newline- [$title]($url)"
          tag_post_pre_newline: true
          commit_message: "docs: atualiza últimos posts do blog no README"
