name: Atualizar últimos vídeos do YouTube no README

# ---------------------------------------------------------------------------
# COMO FUNCIONA:
#
# Lê o feed do canal (https://www.youtube.com/feeds/videos.xml?channel_id=...)
# e reescreve a lista de vídeos do README entre os marcadores:
#      <!-- YOUTUBE:START -->
#      <!-- YOUTUBE:END -->
#
# Com o feed vazio, a action só registra "0 blog posts fetched" e não altera o
# README: o texto que estiver entre os marcadores fica como está.
#
# O README tem duas versões, README.md e README.en.md: a Action atualiza as duas
# de uma vez (readme_path aceita vários arquivos, separados por vírgula). Os
# títulos dos vídeos vêm como o canal os publica.
#
# São dois jobs, de propósito (o mesmo desenho do workflow dos cartões):
#   - "gerar" roda a Action de terceiro com contents: read e sem credencial
#     persistida, e só reescreve os arquivos (skip_commit);
#   - "publicar" só usa Actions oficiais e git, e é o único com contents: write.
#
# Em pull request que mexe neste arquivo (inclusive os do Dependabot), roda só o
# "gerar": os READMEs ficam como artifact do run, para conferir antes do merge.
#
# Sem agendamento ativo: o workflow roda só à mão (workflow_dispatch). O bloco
# "schedule" comentado abaixo, se descomentado, roda a cada 6 horas.
#
# O feed traz só vídeos públicos, os 15 mais recentes, e inclui os Shorts.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *" # a cada 6 horas
  pull_request:
    paths:
      - ".github/workflows/atualizar-videos-youtube.yml"

permissions: {}

# Dois runs ao mesmo tempo disputariam o push na main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar:
    name: Gerar os READMEs
    runs-on: ubuntu-26.04
    # Roda em segundos (lê um feed e reescreve dois arquivos); o teto só corta
    # um run travado.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Puxar vídeos do feed do canal
        # Fixada por SHA, nunca @master: é Action de terceiro. O Dependabot lê o
        # comentário de versão e propõe o SHA novo (dependabot.yml).
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCIwlroMxTGcwdM2zPu2a6NQ"
          comment_tag_name: "YOUTUBE"
          readme_path: "README.md,README.en.md"
          # 4 itens, o mesmo teto dos posts do blog e da tabela de repositórios
          # em destaque: as três listas do perfil têm o mesmo tamanho.
          max_post_count: 4
          # $newline em minúsculas: a action só reconhece esse nome
          template: "$newline- [$title]($url)"
          tag_post_pre_newline: true
          # Só reescreve os arquivos; quem commita é o job "publicar". O
          # keepalive (commit vazio depois de 50 dias parado) também precisaria
          # de escrita, e o repositório já recebe commit todo dia.
          skip_commit: "true"
          enable_keepalive: "false"

      - name: Guardar os READMEs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readmes
          path: |
            README.md
            README.en.md
          if-no-files-found: error
          retention-days: 3

  publicar:
    name: Commitar os READMEs
    needs: gerar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Credencial persistida de propósito: o git push abaixo precisa dela, e
      # neste job não roda código de terceiro.
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Baixar os READMEs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readmes
          path: .

      - name: Commitar se a lista mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          if git diff --cached --quiet; then
            echo "Nenhum vídeo novo."
            exit 0
          fi
          git commit -m "docs: atualiza últimos vídeos do YouTube no README"
          git push
