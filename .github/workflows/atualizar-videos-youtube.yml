name: Atualizar últimos vídeos do YouTube no README

# ---------------------------------------------------------------------------
# COMO FUNCIONA:
#
# Lê o feed do canal (https://www.youtube.com/feeds/videos.xml?channel_id=...)
# e reescreve a lista de vídeos do README entre os marcadores:
#      <!-- YOUTUBE:START -->
#      <!-- YOUTUBE:END -->
#
# Enquanto o canal não tem vídeo público, a action só registra
# "0 blog posts fetched" e não altera o README: o aviso de "em fase de
# preparação", que mora entre os marcadores, continua lá. Quando sair o
# primeiro vídeo, a lista o substitui sozinha, sem editar o README.
#
# O README tem duas versões, README.md e README.en.md: a Action atualiza as duas
# de uma vez (readme_path aceita vários arquivos, separados por vírgula). Os
# títulos dos vídeos vêm como o canal os publica.
#
# PARA LIGAR NO PRIMEIRO VÍDEO (o agendamento está desligado de propósito):
#
# 1. Publique o vídeo e espere ele aparecer no feed (de alguns minutos a
#    algumas horas).
#
# 2. Rode uma vez à mão (aba Actions > Run workflow) e confira o README e o
#    log da execução.
#
# 3. Descomente o bloco "schedule" abaixo.
#
# O feed traz só vídeos públicos, os 15 mais recentes, e inclui os Shorts.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *" # a cada 6 horas

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Puxar vídeos do feed do canal
        # Fixada por SHA, nunca @master: é Action de terceiro e roda com
        # contents: write. O Dependabot lê o comentário de versão e propõe o
        # SHA novo (dependabot.yml).
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCIwlroMxTGcwdM2zPu2a6NQ"
          comment_tag_name: "YOUTUBE"
          readme_path: "README.md,README.en.md"
          # 4 itens, o mesmo teto dos posts do blog e da tabela de repositórios
          # em destaque: as três listas do perfil têm o mesmo tamanho.
          max_post_count: 4
          # $newline em minusculas: a action so reconhece esse nome
          template: "$newline- [$title]($url)"
          tag_post_pre_newline: true
          commit_message: "docs: atualiza últimos vídeos do YouTube no README"
